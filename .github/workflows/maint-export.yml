name: Maintenance log to OneDrive

# Once a day, regenerate the Maintenance Log / Machine History Card workbook from
# the app's data and save it to OneDrive. 13:30 UTC = 7:00 PM IST.
on:
  schedule:
    - cron: '30 13 * * *'
  workflow_dispatch: {}

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Generate + upload workbook
        run: |
          curl -fsS --max-time 120 \
            "https://qms.bharatsteels.in/maint/admin/export-onedrive?token=BSC%40123" \
            -o out.txt -w "HTTP %{http_code}\n" || true
          echo "---- response ----"; cat out.txt || true
