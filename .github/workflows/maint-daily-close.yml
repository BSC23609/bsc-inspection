name: Maintenance daily PM close (7 PM)

# Fires the daily-PM "plant close" once a day at 7:05 PM IST (13:35 UTC), just after the last
# hourly reminder (7:00 PM) and before the reports reconcile (7:30 PM). It finalizes each daily
# PM for the day: a single-assignee machine (or a machine nobody completed) has its incomplete
# work order deleted; a multi-assignee machine with some completions has its PDF finalized with
# the missing person(s) shown as Incomplete. Idempotent — safe to re-run. GitHub cron is UTC.
on:
  schedule:
    - cron: '35 13 * * *'
  workflow_dispatch: {}   # lets you run it manually from the Actions tab

jobs:
  daily-close:
    runs-on: ubuntu-latest
    steps:
      - name: Close today's daily PM
        run: |
          curl -fsS --max-time 120 \
            "https://qms.bharatsteels.in/maint/daily-close?token=BSC%40123" \
            -o response.txt -w "HTTP %{http_code}\n" || true
          echo "---- response ----"
          cat response.txt || true
