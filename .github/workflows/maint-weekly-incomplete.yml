name: Maintenance weekly incomplete-PM report

# Every Saturday, email + WhatsApp the week's incomplete daily-PM checks to the fixed
# recipient list (Kannan, Jeevabharathy, Gourav). Covers the last 7 working days.
# 14:30 UTC = 8:00 PM IST on Saturday — after that day's 7 PM close/finalize.
on:
  schedule:
    - cron: '30 14 * * 6'
  workflow_dispatch: {}

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - name: Send weekly incomplete-PM report
        run: |
          resp=$(curl -fsS --max-time 120 "https://qms.bharatsteels.in/maint/weekly-incomplete?token=BSC%40123&days=7&dry=0" || echo '{}')
          echo "$resp" | head -c 1500
