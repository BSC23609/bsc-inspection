<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0d1421">
  <title>{% block title %}Apps{% endblock %} · Bharat Steel Group</title>
  <link rel="icon" href="/static/img/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Oswald:wght@500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/css/hub.css?v=9">
</head>
<body>
{% block body %}
<header class="topbar">
  <div class="wrap">
    <a class="brand" href="/">
      <img class="logo-plate" src="/static/img/bsc-lockup.png" alt="Bharat Steel (Chennai) Pvt. Ltd.">
      <span class="brand-sub">Bharat Steel Group</span>
    </a>
    <nav class="nav">
      <a href="/" class="{% if not tab %}on{% endif %}">My apps</a>
      {% if user and user.is_superadmin %}<a href="/admin/users" class="{% if tab %}on{% endif %}">Admin</a>{% endif %}
      <span class="who" title="{{ user.email }}{% if user.employee_code %} · {{ user.employee_code }}{% endif %}"><span class="avatar">{{ user.name[:1]|upper }}</span><span class="nm">{{ user.name.split(' ')[0] }}</span></span>
      <a href="/change-password" class="acct"><span class="long">Change password</span><span class="short">Password</span></a>
      <a href="/logout" class="acct out">Sign out</a>
    </nav>
  </div>
</header>
{% block content %}{% endblock %}
{% endblock %}
</body>
</html>
