<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>BSC Coil Sticker Printer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&family=Archivo+Narrow:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#EEF1F4; --panel:#FFFFFF; --ink:#14171A; --muted:#5B6570; --line:#D3D9E0;
  --blue:#1D63B0; --blue-ink:#123F72; --field:#F7F9FB; --ok:#2E9B4F;
  --desk:#C9CFD6;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#15191E; --panel:#1E242B; --ink:#E8ECF0; --muted:#9AA5B1; --line:#323B45;
    --blue:#5C9BE0; --blue-ink:#9CC4F0; --field:#252C34; --desk:#0F1215;
  }
}
:root[data-theme="dark"]{
  --bg:#15191E; --panel:#1E242B; --ink:#E8ECF0; --muted:#9AA5B1; --line:#323B45;
  --blue:#5C9BE0; --blue-ink:#9CC4F0; --field:#252C34; --desk:#0F1215;
}
*,*::before,*::after{box-sizing:inherit}
[hidden]{display:none !important}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Archivo",system-ui,-apple-system,"Segoe UI",Arial,sans-serif;font-size:15px;line-height:1.45}

.app{display:grid;grid-template-columns:minmax(320px,430px) 1fr;min-height:100vh}
.panel{background:var(--panel);border-right:1px solid var(--line);padding:24px 24px 32px;display:flex;flex-direction:column;gap:20px}
.brand{display:flex;flex-direction:column;align-items:flex-start;gap:10px}
.brand img{height:26px;max-width:100%;width:auto;background:#fff;border-radius:4px;padding:3px 6px}
.brand h1{font-size:17px;margin:0;font-weight:700;letter-spacing:-.01em}
.brand p{margin:0;color:var(--muted);font-size:13px}

form{display:grid;grid-template-columns:1fr 1fr;gap:12px 12px}
.f{display:flex;flex-direction:column;gap:4px}
.f.full{grid-column:1/-1}
label{font-size:13px;font-weight:600;color:var(--muted)}
input,select{font:inherit;color:var(--ink);background:var(--field);border:1px solid var(--line);border-radius:6px;padding:9px 10px;width:100%;min-width:0}
input:focus,select:focus,button:focus-visible{outline:2px solid var(--blue);outline-offset:1px}
.size3{display:grid;grid-template-columns:1fr auto 1fr auto 1fr;align-items:center;gap:6px}
.size3 span{color:var(--muted);font-weight:600}
.qty{display:grid;grid-template-columns:1fr 92px;gap:6px}

.opts{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding-top:16px;border-top:1px solid var(--line)}
.check{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--ink);font-weight:500}
.check input{width:18px;height:18px;accent-color:var(--blue)}

.actions{display:flex;gap:10px;flex-wrap:wrap}
button{font:inherit;font-weight:600;border-radius:6px;padding:11px 16px;cursor:pointer;border:1px solid var(--line);background:var(--field);color:var(--ink)}
button.primary{background:var(--blue);border-color:var(--blue);color:#fff;flex:1}
button.primary:hover{filter:brightness(1.07)}
button.link{background:none;border:none;color:var(--blue);padding:4px 0}

.queue h2{font-size:14px;margin:0 0 8px;font-weight:700}
.queue ul{list-style:none;margin:0;padding:0;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.queue li{display:flex;align-items:center;gap:10px;padding:8px 10px;border-top:1px solid var(--line);font-size:13px}
.queue li:first-child{border-top:none}
.queue li .t{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.queue li b{font-weight:700}
.queue li button{padding:4px 8px;font-size:12px}
.queue .empty{color:var(--muted);font-size:13px;margin:0}
.hint{color:var(--muted);font-size:12.5px;margin:0}

.stage{background:var(--desk);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px 20px;gap:14px;overflow:auto}
.stage .cap{color:var(--muted);font-size:13px}
.preview-wrap{box-shadow:0 2px 0 rgba(0,0,0,.06),0 18px 40px -18px rgba(0,0,0,.45)}

/* ===== The sticker (real mm units) ===== */
/* tabs */
.tabs{display:grid;grid-template-columns:1fr 1fr;background:var(--field);border:1px solid var(--line);border-radius:8px;padding:3px;gap:3px}
.tabs a{display:block;text-align:center;text-decoration:none;color:var(--muted);font-weight:600;font-size:14px;padding:8px 6px;border-radius:6px;line-height:1.25}
.tabs a small{display:block;font-weight:500;font-size:12px}
.tabs a[aria-current="page"]{background:var(--panel);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.tabs a:focus-visible{outline:2px solid var(--blue)}
.view[hidden]{display:none !important}

/* ===== Stickers (real mm units) ===== */
.label{background:#fff;color:#000;position:relative;overflow:hidden;font-family:"Archivo",Arial,sans-serif;display:flex;flex-direction:column}
.label img{display:block}
.spot{flex:none;width:18mm;height:18mm;border-radius:50%;border:.3mm dashed #9aa4ae}

/* --- Wheels India 10x15 --- */
.label.wi{width:100mm;height:150mm;padding:5mm}
.wi .logo{flex:none;display:flex;align-items:center;justify-content:center;padding:1mm 0 3.5mm;border-bottom:.6mm solid #000}
.wi .logo img{width:100%;height:auto}
.wi .body{flex:1;display:grid;grid-template-rows:repeat(8,1fr);min-height:0;padding-top:.5mm}
.wi .row{display:grid;grid-template-columns:31mm 4mm minmax(0,1fr);align-items:center;padding:0 1mm;border-bottom:.25mm solid #9a9a9a;min-height:0;font-weight:700;font-size:5.2mm;line-height:1.1;text-transform:uppercase}
.wi .row:last-child{border-bottom:none}
.wi .k{white-space:nowrap}
.wi .c{text-align:center}
.wi .v{padding-left:1mm;overflow-wrap:anywhere}
.wi .paste{flex:none;height:21mm;border-top:.6mm solid #000;display:flex;align-items:center;justify-content:flex-end;padding-right:2mm}
/* landscape */
.label.wi.land{width:150mm;height:100mm;padding:4mm 5mm}
.wi.land .logo{justify-content:space-between;gap:5mm;padding:0 0 2mm 0}
.wi.land .logo img{flex:1;min-width:0;width:100%;height:auto;max-height:16mm;object-fit:contain;object-position:left center}
.wi.land .body{padding-top:1mm;grid-template-rows:repeat(4,1fr);grid-template-columns:1fr 1fr;grid-auto-flow:column;column-gap:6mm}
.wi.land .row:nth-child(4){border-bottom:none}
.wi.land .row{grid-template-columns:27.5mm 3mm minmax(0,1fr);font-size:4.4mm}

/* --- Other customers 2.5x10 --- */
.label.oc{width:100mm;height:25mm;padding:1.6mm 3mm}
.oc .logo{flex:none;display:flex;justify-content:space-between;align-items:center;gap:3mm;padding-bottom:1mm;border-bottom:.35mm solid #000;font-weight:700;text-transform:uppercase;line-height:1.1}
.oc .logo img{height:2em;width:auto;flex:none}
.oc .hd{display:flex;gap:1.4mm;white-space:nowrap}
.oc .sbody{flex:1;min-height:0;display:grid;align-content:space-evenly;align-items:center;column-gap:1.4mm;padding-top:.5mm;font-weight:700;text-transform:uppercase;line-height:1.08}
.oc .k{white-space:nowrap}
.oc .v{white-space:nowrap;overflow:hidden;min-width:0}
.oc .k2{padding-left:3mm}

@media print{ .spot{border-color:transparent !important} }

.preview-wrap.zoom{zoom:2}
@media (max-width:860px){.preview-wrap.zoom{zoom:1;transform:none}}

#printArea{display:none}

@media (max-width:860px){
  .app{grid-template-columns:1fr}
  .panel{border-right:none;border-bottom:1px solid var(--line)}
  .stage{padding:24px 8px}
  .preview-wrap{transform:scale(.8);transform-origin:top center}
}

@media print{
  html,body{background:#fff !important;margin:0;padding:0}
  :root{padding:0}
  .app{display:none !important}
  #printArea{display:block}
  #printArea .label{page-break-after:always;break-after:page;box-shadow:none}
  #printArea .label:last-child{page-break-after:auto;break-after:auto}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
@media (prefers-reduced-motion:reduce){*{transition:none !important}}
</style>
</head>

const $=id=>document.getElementById(id);
const store={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const up=s=>esc(String(s||"").toUpperCase());
const fmtDate=iso=>{if(!iso)return"";const[y,m,d]=iso.split("-");return`${d}/${m}/${y}`};
const sizeStr=o=>[o.t,o.w,o.l].filter(Boolean).join("*");
const qtyStr=o=>o.qty?esc(o.qty)+" "+esc(o.unit):"";
const today=()=>new Date(Date.now()-new Date().getTimezoneOffset()*60000).toISOString().slice(0,10);

/* ---------- sticker types ---------- */
const TYPES={
  wi:{name:"Wheels India",fields:["date","grade","customer","coil","heat","source","t","w","l","qty","unit"],
      page:o=>o.orient==="land"?"150mm 100mm":"100mm 150mm",
      hint:"In the print dialog, pick the label printer, set paper size to 100 × 150 mm (150 × 100 for landscape), margins to none and scale to 100%. The dashed circle shows where to paste the approved sticker; it does not print.",
      summary:d=>`<b>${esc(d.coil||"—")}</b> &nbsp;${esc(d.customer)} &nbsp;${esc(sizeStr(d))}`},
  oc:{name:"Other customers",fields:["date","batch","source","grade","t","w","l","qty","unit"],
      page:()=>"100mm 25mm",
      hint:"In the print dialog, pick the label printer, set paper size to 100 × 25 mm, margins to none and scale to 100%.",
      summary:d=>`<b>${esc(d.batch||"—")}</b> &nbsp;${esc(d.grade)} &nbsp;${esc(sizeStr(d))}`}
};
let cur="wi";

function readOpts(t){return t==="wi"?{orient:$("wi-orient").value}:{showSource:$("oc-showSource").checked,showLogo:$("oc-showLogo").checked}}
function read(t){const o={};TYPES[t].fields.forEach(f=>o[f]=$(t+"-"+f).value.trim());return o}

/* Wheels India 10x15 */
function wiHTML(o,opt){
  const land=opt.orient==="land";
  const rows=[["Date",fmtDate(o.date)],["Customer",up(o.customer)],["Coil no",up(o.coil)],["Heat no",up(o.heat)],["Grade",up(o.grade)],["Source",up(o.source)],["Size",esc(sizeStr(o))],["Quantity",qtyStr(o).toUpperCase()]];
  const row=r=>`<div class="row"><span class="k">${r[0]}</span><span class="c">:</span><span class="v">${r[1]||"&nbsp;"}</span></div>`;
  const logo=`<img src="${LOGO}" alt="Bharat Steel (Chennai) Pvt. Ltd.">`;
  return land
   ?`<div class="label wi land"><div class="logo">${logo}<div class="spot" title="Paste approved sticker here"></div></div><div class="body">${rows.map(row).join("")}</div></div>`
   :`<div class="label wi"><div class="logo">${logo}</div><div class="body">${rows.map(row).join("")}</div><div class="paste"><div class="spot" title="Paste approved sticker here"></div></div></div>`;
}
function fitWI(lab){const rows=[...lab.querySelectorAll(".row")];rows.forEach(r=>r.style.fontSize="");let fs=parseFloat(getComputedStyle(rows[0]).fontSize),n=0;
  const over=()=>rows.some(r=>{const v=r.querySelector(".v"),k=r.querySelector(".k");return v.scrollWidth>v.clientWidth+1||k.scrollWidth>k.clientWidth+1||v.offsetHeight>r.clientHeight-4});
  while(over()&&fs>8&&n<60){fs-=0.5;rows.forEach(r=>r.style.fontSize=fs+"px");n++}}

/* Other customers 2.5x10 — tries several layouts and keeps the one with the biggest text */
/* print order: Date, Source, Grade + Size (same line), Batch no, Qty (Date sits in the header beside the logo) */
function ocFields(o,opt){
  let rows=[["date","Date",fmtDate(o.date)],["source","Source",up(o.source)],["grade","Grade",up(o.grade)],["size","Size",esc(sizeStr(o))],["batch","Batch no",up(o.batch)],["qty","Qty",qtyStr(o).toUpperCase()]];
  if(!opt.showSource)rows=rows.filter(r=>r[0]!=="source");
  if(opt.showLogo)rows=rows.filter(r=>r[0]!=="date");
  return rows;
}
/* layouts that keep the reading order; Grade and Size always share one line */
function ocLayouts(rows){
  const gi=rows.findIndex(r=>r[0]==="grade");
  const before=rows.slice(0,gi),gs=[rows[gi],rows[gi+1]],after=rows.slice(gi+2);
  const pair=a=>{const out=[];for(let i=0;i<a.length;i+=2)out.push(a.slice(i,i+2));return out};
  return [
    [...before.map(r=>[r]),gs,...after.map(r=>[r])],
    [...before.map(r=>[r]),gs,...pair(after)],
    [...pair(before),gs,...pair(after)]
  ];
}
function ocBody(lay){
  const two=lay.some(r=>r.length===2);
  const cols=two?"max-content max-content minmax(0,auto) max-content max-content minmax(0,1fr)":"max-content max-content minmax(0,1fr)";
  const cell=(r,k2)=>`<span class="k${k2?" k2":""}">${r[1]}</span><span class="c">:</span>`;
  let h="";lay.forEach(row=>{const[a,b]=row;
    h+=cell(a)+`<span class="v"${!b&&two?' style="grid-column:3/-1"':""}>${a[2]||"&nbsp;"}</span>`;
    if(b)h+=cell(b,1)+`<span class="v">${b[2]||"&nbsp;"}</span>`;});
  return `<div class="sbody" style="grid-template-columns:${cols};grid-template-rows:repeat(${lay.length},auto)">${h}</div>`;
}
function ocHTML(o,opt){
  const rows=ocFields(o,opt);
  const head=opt.showLogo?`<div class="logo"><img src="${LOGO}" alt="Bharat Steel (Chennai) Pvt. Ltd."><span class="hd"><span class="k">Date</span><span class="c">:</span><span class="v">${fmtDate(o.date)||"&nbsp;"}</span></span></div>`:"";
  return `<div class="label oc" data-o='${esc(JSON.stringify(o))}' data-opt='${esc(JSON.stringify(opt))}'>${head}${ocBody(ocLayouts(rows)[0])}</div>`;
}
const MM=96/25.4;
/* tries each layout, keeps the one with the biggest text; header and body always share one font size */
function fitOC(lab){
  const o=JSON.parse(lab.dataset.o),opt=JSON.parse(lab.dataset.opt),rows=ocFields(o,opt);
  const head=lab.querySelector(".logo");
  const setFs=(b,m)=>{b.style.fontSize=m+"px";if(head)head.style.fontSize=m+"px"};
  let best=null;
  ocLayouts(rows).forEach((lay,i)=>{
    lab.querySelector(".sbody").outerHTML=ocBody(lay);
    const b=lab.querySelector(".sbody");
    const fits=()=>b.scrollHeight<=b.clientHeight+0.5&&b.scrollWidth<=b.clientWidth+0.5&&[...b.querySelectorAll(".v")].every(v=>v.scrollWidth<=v.clientWidth+0.5)&&(!head||head.scrollWidth<=head.clientWidth+0.5);
    let lo=1.6*MM,hi=7*MM;
    for(let k=0;k<16;k++){const m=(lo+hi)/2;setFs(b,m);if(fits())lo=m;else hi=m}
    if(!best||lo>best.fs+0.15)best={fs:lo,lay};   // prefer the simple one-per-line layout unless another is clearly bigger
  });
  lab.querySelector(".sbody").outerHTML=ocBody(best.lay);
  setFs(lab.querySelector(".sbody"),best.fs);
}

function html(t,o,opt){return t==="wi"?wiHTML(o,opt):ocHTML(o,opt)}
function fit(root){root.querySelectorAll(".label.wi").forEach(fitWI);root.querySelectorAll(".label.oc").forEach(fitOC)}

/* ---------- UI ---------- */
function render(){
  $("preview").innerHTML=html(cur,read(cur),readOpts(cur));fit($("preview"));
  store.set("bsc_last_"+cur,{source:$(cur+"-source").value,unit:$(cur+"-unit").value,...readOpts(cur)});
}
function setPage(t,opt){$("pageRule").textContent=`@page { size: ${TYPES[t].page(opt)}; margin: 0; }`}
function rememberLists(o){
  if(o.customer){const c=new Set(store.get("bsc_customers",[]));c.add(o.customer);store.set("bsc_customers",[...c].slice(-60))}
  if(o.source){const s=new Set(store.get("bsc_sources",["AMNS"]));s.add(o.source);store.set("bsc_sources",[...s].slice(-30))}
  fillLists();
}
function fillLists(){
  $("custList").innerHTML=store.get("bsc_customers",[]).map(v=>`<option value="${esc(v)}">`).join("");
  $("srcList").innerHTML=store.get("bsc_sources",["AMNS"]).map(v=>`<option value="${esc(v)}">`).join("");
}
function doPrint(items){
  const opt=readOpts(cur);setPage(cur,opt);
  let h="";items.forEach(it=>{for(let i=0;i<Math.max(1,+it.copies||1);i++)h+=html(cur,it.data,opt)});
  const pa=$("printArea");pa.innerHTML=h;
  const imgs=[...pa.querySelectorAll("img")];
  Promise.all(imgs.map(i=>i.complete?1:new Promise(r=>{i.onload=i.onerror=r}))).then(()=>{
    pa.style.cssText="display:block;position:absolute;left:-9999px;top:0";fit(pa);pa.style.cssText="";
    setTimeout(()=>window.print(),50);
  });
}
let batches={wi:store.get("bsc_batch",[]),oc:store.get("bsc_batch_oc",[])};
function saveBatch(){store.set(cur==="wi"?"bsc_batch":"bsc_batch_oc",batches[cur])}
function renderQueue(){
  const b=batches[cur];
  $("qTitle").textContent=`${TYPES[cur].name} batch (${b.length})`;
  $("qEmpty").hidden=b.length>0;$("qList").hidden=!b.length;$("qActions").hidden=!b.length;
  $("qList").innerHTML=b.map((x,i)=>`<li><span class="t">${TYPES[cur].summary(x.data)} &nbsp;×${x.copies}</span><button data-e="${i}">Edit</button><button data-r="${i}">Remove</button></li>`).join("");
  saveBatch();
}
function switchTab(t){
  cur=t;
  document.querySelectorAll(".tabs a").forEach(a=>{if(a.dataset.tab===t)a.setAttribute("aria-current","page");else a.removeAttribute("aria-current")});
  $("view-wi").hidden=t!=="wi";$("view-oc").hidden=t!=="oc";
  $("hint").textContent=TYPES[t].hint;
  $("preview").classList.toggle("zoom",t==="oc");$("cap").textContent=t==="oc"?"Preview at 2× size":"Actual-size preview";
  document.title=`BSC Sticker Printer: ${TYPES[t].name}`;
  renderQueue();render();
}
function route(){switchTab(location.hash==="#other-customers"?"oc":"wi")}

$("printBtn").onclick=()=>{const o=read(cur);rememberLists(o);doPrint([{data:o,copies:$(cur+"-copies").value}])};
$("addBtn").onclick=()=>{const o=read(cur);rememberLists(o);batches[cur].push({data:o,copies:+$(cur+"-copies").value||1});
  (cur==="wi"?["coil","heat","qty"]:["batch","qty"]).forEach(f=>$(cur+"-"+f).value="");$(cur+"-copies").value=1;renderQueue();render();$(cur+"-"+(cur==="wi"?"coil":"batch")).focus()};
$("printBatch").onclick=()=>doPrint(batches[cur]);
$("clearBatch").onclick=()=>{if(confirm("Remove all stickers from this batch?")){batches[cur]=[];renderQueue()}};
$("qList").onclick=e=>{const r=e.target.dataset.r,ed=e.target.dataset.e,b=batches[cur];
  if(r!==undefined){b.splice(+r,1);renderQueue()}
  if(ed!==undefined){const x=b.splice(+ed,1)[0];TYPES[cur].fields.forEach(f=>$(cur+"-"+f).value=x.data[f]||"");$(cur+"-copies").value=x.copies;renderQueue();render()}};
document.querySelectorAll(".view input,.view select").forEach(el=>{el.addEventListener("input",render);el.addEventListener("change",render)});
window.addEventListener("hashchange",route);

["wi","oc"].forEach(t=>{
  $(t+"-date").value=today();const l=store.get("bsc_last_"+t,{});
  if(l.source)$(t+"-source").value=l.source;if(l.unit)$(t+"-unit").value=l.unit;
  if(t==="wi"&&l.orient)$("wi-orient").value=l.orient;
  if(t==="oc"){if(l.showSource===false)$("oc-showSource").checked=false;if(l.showLogo===false)$("oc-showLogo").checked=false}
});
fillLists();
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(render);
route();
</script>

<style>
#officeStatus{font-size:13px;margin-top:10px;padding:8px 12px;border-radius:7px;display:none}
#officeStatus.q{display:block;background:#fef3c7;color:#92400e}
#officeStatus.ok{display:block;background:#d1fae5;color:#065f46}
#officeStatus.err{display:block;background:#fee2e2;color:#991b1b}
.sec-btn{background:#fff;border:1px solid var(--line);color:var(--muted);font-weight:600;border-radius:6px;padding:9px 14px;cursor:pointer}
</style>
<script>
/* ================= QMS office-printer path (Path B via the Windows agent) ================= */
/* The sticker is rendered exactly as previewed, rasterised to the printer's resolution, turned
   into TSPL and queued on the QMS server; the C:\bsc-agent agent prints it RAW over USB. */
const PRCFG = { dpi:203, printableWidthMm:100, invertBitmap:false, threshold:160,
                direction:1, density:12, speed:3, gapMm:3, enableBluetoothPrinting:false };
(function(){ try{ Object.assign(PRCFG, JSON.parse(localStorage.getItem('bsc_prcfg')||'{}')); }catch(e){} })();
const _dpmm = ()=>PRCFG.dpi/25.4;

const TSPL = {
  build(canvas, heightMm, copies){
    const w=canvas.width, hgt=canvas.height, d=canvas.getContext('2d').getImageData(0,0,w,hgt).data;
    const wb=Math.ceil(w/8), bytes=new Uint8Array(wb*hgt);
    for(let y=0;y<hgt;y++) for(let x=0;x<w;x++){ const i=(y*w+x)*4; const a=d[i+3];
      const lum=a<10?255:(0.299*d[i]+0.587*d[i+1]+0.114*d[i+2]); const dark=lum<PRCFG.threshold;
      let bit=dark?0:1; if(PRCFG.invertBitmap) bit=bit?0:1; if(bit) bytes[y*wb+(x>>3)]|=(0x80>>(x&7)); }
    const enc=new TextEncoder();
    const head=enc.encode('SIZE 100 mm,'+heightMm+' mm\r\nGAP '+PRCFG.gapMm+' mm,0 mm\r\nDIRECTION '+PRCFG.direction+
      '\r\nREFERENCE 0,0\r\nDENSITY '+PRCFG.density+'\r\nSPEED '+PRCFG.speed+'\r\nCLS\r\nBITMAP 0,0,'+wb+','+hgt+',0,');
    const tail=enc.encode('\r\nPRINT 1,'+(copies||1)+'\r\n');
    const out=new Uint8Array(head.length+bytes.length+tail.length);
    out.set(head,0); out.set(bytes,head.length); out.set(tail,head.length+bytes.length); return out;
  }
};
function _b64(bytes){ let s=''; for(let i=0;i<bytes.length;i+=0x8000) s+=String.fromCharCode.apply(null,bytes.subarray(i,i+0x8000)); return btoa(s); }
async function _serverJob(stickerType, printerKey, copies, bytes){
  const r=await fetch('/api/print-jobs',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({sticker_type:stickerType, printer_key:printerKey, copies:copies, tspl_base64:_b64(bytes)})});
  if(r.status===401) throw new Error('Not signed in — open the QMS app and log in first.');
  const d=await r.json().catch(()=>({})); if(!r.ok||!d.id) throw new Error(d.error||'server rejected the job'); return d.id;
}
async function _pollJob(id,onStatus){ for(let i=0;i<60;i++){ await new Promise(r=>setTimeout(r,2000));
  try{ const r=await fetch('/api/print-jobs?mine=1',{cache:'no-store'}); const list=await r.json();
    const j=(list||[]).find(x=>x.id===id); if(j){ onStatus(j.status,j.error); if(j.status==='done'||j.status==='failed') return j; } }catch(e){} }
  return {status:'timeout'}; }

async function sendToOffice(items){
  if(!items||!items.length) return;
  if(typeof html2canvas!=='function'){ alert('Renderer not loaded — using the browser print dialog instead.'); return doPrint(items); }
  const type=cur, opt=readOpts(type);
  const heightMm = type==='wi' ? (opt.orient==='land'?100:150) : 25;
  const printerKey = type==='wi' ? 'large_100x150' : 'small_25x100';
  const st=document.getElementById('officeStatus'); st.className='q'; st.textContent='Rendering sticker(s)\u2026';
  const box=document.createElement('div'); box.style.cssText='position:fixed;left:-99999px;top:0;background:#fff';
  box.innerHTML=items.map(it=>html(type,it.data,opt)).join('');
  document.body.appendChild(box);
  try{
    const imgs=[...box.querySelectorAll('img')];
    await Promise.all(imgs.map(i=>i.complete?1:new Promise(r=>{i.onload=i.onerror=r;})));
    if(document.fonts&&document.fonts.ready) await document.fonts.ready;
    fit(box); await new Promise(r=>setTimeout(r,60));
    const labels=[...box.querySelectorAll('.label')];
    const W=Math.round(_dpmm()*PRCFG.printableWidthMm), H=Math.round(_dpmm()*heightMm);
    for(let i=0;i<labels.length;i++){
      const copies=Math.max(1,parseInt(items[i].copies,10)||1);
      const scale=W/labels[i].offsetWidth;
      const hcan=await html2canvas(labels[i],{backgroundColor:'#ffffff',scale:scale,logging:false,useCORS:true});
      const c=document.createElement('canvas'); c.width=W; c.height=H; const x=c.getContext('2d');
      x.fillStyle='#fff'; x.fillRect(0,0,W,H); x.drawImage(hcan,0,0,W,H);
      const bytes=TSPL.build(c,heightMm,copies);
      st.textContent='Queuing sticker '+(i+1)+'/'+labels.length+(copies>1?(' \u00d7'+copies):'')+'\u2026';
      const id=await _serverJob(type,printerKey,copies,bytes);
      const res=await _pollJob(id,(s,e)=>{ st.textContent='Sticker '+(i+1)+'/'+labels.length+': '+s+(e?(' \u2014 '+e):''); });
      if(res.status==='failed') throw new Error(res.error||'print failed');
    }
    st.className='ok'; st.textContent='\u2713 Sent '+labels.length+' sticker(s) to the office printer.';
  }catch(e){ st.className='err'; st.textContent='Failed: '+((e&&e.message)||e); }
  finally{ box.remove(); }
}

/* Wire the primary buttons to the office printer; keep the browser dialog as a fallback. */
(function(){
  const $$ = id=>document.getElementById(id);
  const statusDiv=document.createElement('div'); statusDiv.id='officeStatus';
  const act=$$('printBtn').parentNode; act.parentNode.insertBefore(statusDiv, act.nextSibling);

  const pb=$$('printBtn'); pb.textContent='Send to office printer';
  pb.onclick=()=>{ const o=read(cur); rememberLists(o); sendToOffice([{data:o,copies:$$(cur+'-copies').value}]); };
  const brow=document.createElement('button'); brow.className='sec-btn'; brow.textContent='Print via browser';
  brow.onclick=()=>{ const o=read(cur); rememberLists(o); doPrint([{data:o,copies:$$(cur+'-copies').value}]); };
  pb.parentNode.insertBefore(brow, $$('addBtn'));

  const pbatch=$$('printBatch'); pbatch.textContent='Send batch to office printer';
  pbatch.onclick=()=>sendToOffice(batches[cur]);
  const browB=document.createElement('button'); browB.className='sec-btn'; browB.textContent='Print batch via browser';
  browB.onclick=()=>doPrint(batches[cur]);
  pbatch.parentNode.insertBefore(browB, $$('clearBatch'));

  // light sign-in check
  fetch('/api/print-jobs?mine=1',{cache:'no-store'}).catch(()=>{});
})();
</script>
